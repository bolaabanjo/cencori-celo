<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cencori Agent</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <header class="site-header">
      <div class="brand">
        <img class="brand-logo" src="/logo/black.svg" width="32" height="32" alt="Cencori" />
        <div>
          <p class="brand-kicker">AI Agent</p>
          <h1>Cencori</h1>
        </div>
      </div>
      <p class="brand-sub">
        Run AI agents, review responses, and manage your subscription.
      </p>
    </header>

    <main class="layout">
      <aside class="panel status-panel" id="status-panel">
        <h2>Account</h2>
        <div class="status-grid" id="status-grid">
          <p class="muted">Loading…</p>
        </div>
        <div class="panel-actions" id="account-actions">
          <button type="button" class="btn btn-primary" id="btn-connect">
            Connect Wallet
          </button>
          <button type="button" class="btn btn-secondary hidden" id="btn-subscribe">
            Subscribe Pro — $5/mo
          </button>
          <span class="tag tag-green hidden" id="pro-badge">Pro</span>
        </div>
      </aside>

      <section class="panel run-panel">
        <div class="panel-head">
          <h2>Agent</h2>
          <div class="panel-head-right">
            <span class="tag tag-blue" id="model-tag">—</span>
            <span class="tag tag-yellow" id="tier-tag">Free</span>
          </div>
        </div>

        <label class="field-label" for="task-input">What would you like to do?</label>
        <textarea
          id="task-input"
          rows="6"
          placeholder="Ask something…"
        ></textarea>

        <div class="run-actions">
          <button type="button" class="btn btn-primary" id="btn-run">
            Run
          </button>
          <span class="run-hint muted" id="run-hint"></span>
        </div>

        <div class="output-wrap hidden" id="output-wrap">
          <div class="output-meta" id="output-meta"></div>
          <article class="output-body" id="output-body"></article>
        </div>
      </section>

      <aside class="panel history-panel">
        <h2>Recent runs</h2>
        <ul class="run-list" id="run-list">
          <li class="muted">No runs yet</li>
        </ul>
      </aside>
    </main>

    <footer class="site-footer muted">
      <p>Free tier uses standard model. <button type="button" class="btn-inline" id="footer-subscribe">Subscribe Pro</button> for the premium model ($5/mo).</p>
    </footer>

    <script src="/app.js" type="module"></script>
  </body>
</html>
